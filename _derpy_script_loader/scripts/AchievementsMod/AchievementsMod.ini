; AchievementsMod bridge settings.
; leave these values alone unless you know what youre doing.

[Performance]
; How often the game writes updated achievement telemetry for the native backend.
telemetryPollMs=1000

; How often the Achievements menu refreshes its state from the backend.
statePollMs=500

; How often the in-game popup checks for new backend popup data.
popupPollMs=150

[Popup]
; On-screen popup duration in milliseconds.
popupDurationMs=4000

; Fade-out length for the popup in milliseconds.
popupFadeMs=250

[Compatibility]
; Small delay after gameplay loads before telemetry starts.
; Leave this enabled to avoid bad startup state reads.
runtimeWarmupMs=3000

; Optional override for custom installs.
; Leave blank for normal installs.
gamePath=
