; AchievementsMod native backend settings.

[General]
; Master switch for the standalone achievements backend.
Enable=1

; Keep this off in the shipped build. Turn it on only for troubleshooting.
VerboseLogging=0

; How often the backend reads fresh telemetry from the Lua bridge.
BackendPollMs=1000

; Allow achievement popups during missions.
PopupDuringMission=1

; Popup timing in milliseconds.
PopupDurationMs=4000
PopupGapMs=600

[Audio]
; Plays a custom MP3 when an achievement unlocks.
EnablePopupMp3=1

; 1000 = full volume.
PopupMp3Volume=1000

; Relative to _derpy_script_loader/scripts/AchievementsMod
PopupMp3Path=Audio\MP3\steam_unlock.mp3
